    <style>
:root{
  --red:#C8102E; --red-dark:#8E0C22; --red-soft:#FDECEE;
  --ink:#1F2328; --muted:#5C6370; --line:#E7E8EB; --bg:#F6F6F7; --card:#FFFFFF;
  --gold:#B37E00; --gold-soft:#FFF4D6;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --c:#C8102E; --t:#FDECEE;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
a{color:inherit}
button{font:inherit;cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:10px clamp(14px,3vw,32px);background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:17px;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.16);font-size:19px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;opacity:.95;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs a{text-decoration:none;opacity:.85}.crumbs a:hover{opacity:1;text-decoration:underline}
.crumbs .sep{opacity:.6}

main{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(14px,3vw,32px) 40px;outline:none}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:0 0 28px}

/* Portada */
.hero{text-align:center;margin:4px 0 20px}
.hero h1{margin:0 0 4px;font-size:clamp(20px,2.4vw,26px)}
.hero p{margin:0;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:960px){.home-grid{grid-template-columns:1fr}}
.home-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  border-top:5px solid var(--c);transition:transform .15s ease,box-shadow .15s ease}
.home-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.10)}
.home-head{display:flex;gap:12px;align-items:center;padding:16px 18px 12px;text-decoration:none;background:var(--t)}
.home-icon{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--c);color:#fff;font-size:27px}
.home-head h2{margin:0;font-size:18px;color:var(--c)}
.home-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.home-list{list-style:none;margin:0;padding:6px 0;flex:1}
.home-list a{display:flex;align-items:center;gap:10px;padding:8px 18px;text-decoration:none;font-weight:600;font-size:14.5px}
.home-list a:hover{background:#FAFAFB}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.home-list .chev{margin-left:auto;color:var(--muted)}
.home-cta{display:block;margin:4px 18px 18px;padding:11px;border-radius:10px;text-align:center;background:var(--c);color:#fff;font-weight:700;text-decoration:none}
.home-cta:hover{filter:brightness(1.07)}

/* Cabecera de libro */
.book-head{background:var(--c);color:#fff;border-radius:var(--radius);padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.book-head .ic{font-size:26px}
.book-head h1{margin:0;font-size:clamp(17px,2vw,21px);line-height:1.25}
.book-head p{margin:2px 0 0;opacity:.92;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 2px}
.tab{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:8px;
  background:var(--tc);color:#fff;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;
  opacity:.72;transition:opacity .15s ease}
.tab:hover{opacity:.95}
.tab[aria-current="page"]{opacity:1;outline:2px solid var(--tc);outline-offset:2px;font-weight:700}
.remember{margin:10px 0 0;background:#fff;border:1.5px solid var(--c);border-radius:12px;padding:9px 14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--c);font-weight:600}
.remember b{letter-spacing:.06em;font-size:12px;background:var(--c);color:#fff;padding:3px 8px;border-radius:6px}
.remember .step{display:flex;align-items:center;gap:6px}
.remember .arrow{opacity:.5}
.argue{margin:12px 0 0;font-size:13.5px;color:var(--muted)}
.argue strong{color:var(--c)}

/* Buscador */
.search{position:relative;margin-top:10px}
.search input{width:100%;padding:11px 40px 11px 44px;font-size:16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;
  box-shadow:var(--shadow)}
.search input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 15%,transparent)}
.search .sic{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:19px;color:var(--muted)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;display:none}
.search.has .clear{display:block}
.hint{font-size:12.5px;color:var(--muted);margin:6px 4px 0}
.results{margin:10px 0 0}
.results h3{font-size:14px;margin:0 0 10px;color:var(--ink)}
.results .none{background:#fff;border-radius:12px;padding:14px 16px;color:var(--muted);border:1px dashed var(--line)}

/* Listado */
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 8px}
.section-title h2{margin:0;font-size:15px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.toggle input{accent-color:var(--gold);width:16px;height:16px}
.list{display:grid;gap:10px}
.list.obj{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));align-items:stretch}

.item{background:#fff;border-radius:12px;box-shadow:var(--shadow);border-left:5px solid var(--ic,var(--c));overflow:hidden}
.item-top{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--ic,var(--c));padding:1px 8px;border-radius:999px;margin-bottom:4px}
.say{margin:0;font-size:15px;font-weight:700;line-height:1.35;color:var(--ic,var(--c))}
.say::before{content:"«"}.say::after{content:"»"}
.star{margin-left:auto;flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:6px}
.star svg{font-size:14px}
.star.on{background:var(--gold-soft);border-color:#F1D27A;color:var(--gold)}
.star.on svg{fill:currentColor}
.item-body{padding:4px 14px 12px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:6px 0 2px}
.answer{margin:0;font-size:14px}
.todo{margin:8px 0 0;background:#F7F7F8;border-radius:8px;padding:7px 11px;font-size:13px}
.todo strong{color:var(--ink)}
.fans{margin-top:8px;font-size:12px;color:var(--gold)}

/* Quejas */
.q .q-head{padding:10px 14px;background:var(--ic);color:#fff;font-weight:700;font-size:15px;letter-spacing:.01em}
.q .q-dice{padding:8px 14px;background:var(--it);color:var(--ic);font-weight:600;font-style:italic;font-size:14px}
.q .q-preg{padding:6px 14px 2px}
.q .q-preg ul{margin:4px 0 0;padding-left:18px}
.q .q-preg li{margin:2px 0}
.causes{width:100%;border-collapse:collapse;font-size:13.8px}
.causes th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ic);background:var(--it);padding:8px 12px}
.causes td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
.causes td.sol{font-weight:600}
.causes td.rie{color:#8A5300;font-style:italic}
.q-wrap{padding:4px 2px 8px}
@media (max-width:720px){
  .causes thead{display:none}
  .causes tr{display:block;border-top:1px solid var(--line);padding:8px 12px}
  .causes td{display:block;border:0;padding:2px 0}
  .causes td::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* Guía y Habla */
.panel{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.panel h2{margin:0 0 8px;font-size:15.5px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:3px 0}
.empty{background:#fff;border-radius:12px;border:1.5px dashed var(--line);padding:22px;text-align:center;color:var(--muted)}

mark{background:#FFF1A8;color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:600px){
  .crumbs{display:none}
  html,body{font-size:14.5px}
  .item-top{flex-wrap:nowrap}
  .star .st-txt{display:none}
  .star{padding:5px 7px}
  .remember .arrow{display:none}
  .tab{padding:7px 10px;font-size:12.5px}
  .remember{flex-direction:column;align-items:flex-start}
}

/* Términos técnicos con explicación */
abbr.term{text-decoration:none;border-bottom:1.5px dotted currentColor;cursor:help;outline:none}
abbr.term:focus-visible{background:#FFF1A8;border-radius:3px}
.tip{position:fixed;z-index:50;max-width:280px;background:#1F2328;color:#fff;border-radius:10px;padding:9px 12px;
  font-size:12.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.22);pointer-events:none}
.tip b{display:block;font-size:12.5px;margin-bottom:2px;color:#FFD5DB}
.tip span{display:block;color:#E9EAEC;font-weight:400;font-style:normal}

/* Habla de Audio */
.place{margin:16px 0 8px;font-size:14px;color:var(--c);display:flex;align-items:center;gap:6px}
.item.speech .item-body{padding-top:12px}
.item.speech .line{margin:6px 0 0;font-size:15px;font-weight:600;line-height:1.45;color:var(--ink)}

</style>
</head>

    `<div class="remember" style="--c:${c}"><b>RECUERDA</b>${steps.map((s, i) =>
      `${i ? '<span class="arrow">›</span>' : ""}<span class="step">${s}</span>`).join("")}</div>`;

  const REC_OBJ = ["👂 1. Escucha la objeción sin interrumpir", "🤝 2. Dile que le entiendes", "💡 3. Argumenta: necesidad y consecuencias", "🎯 4. Propón la solución y cierra con una fecha"];
  const REC_QJ = ["👂 1. Escucha la queja y pide un ejemplo", "🤝 2. Dile que le entiendes y que tiene solución", "🔍 3. Revisa antes molde, cera, tubo y audífono", "🛠️ 4. Solo entonces, reprograma", "✅ 5. Comprueba con él y cita de revisión"];
  const REC_HABLA = ["😊 Sonríe y llámale por su nombre", "👂 Escucha más de lo que hablas", "🗣️ Palabras sencillas, sin tecnicismos", "🎯 Termina siempre con el siguiente paso"];

  function objCard(it, showBadge) {
    const mine = isFav(it.id);
    return `<article class="item" style="--ic:${it.libro.color}" id="${it.id}">
      <div class="item-top"><div>${showBadge ? `<span class="badge">${it.libro.icono} ${esc(it.libro.nombre)}</span>` : ""}
        <p class="say">${esc(it.dice)}</p></div>
        <button class="star ${mine ? "on" : ""}" data-fav="${it.id}" type="button" aria-pressed="${mine}">${ICON.star}<span class="st-txt">${mine ? "Me funciona" : "¿Te funciona?"}</span></button></div>
      <div class="item-body"><div class="lbl">💬 Tú respondes</div><p class="answer">${tx(it.responde)}</p>
        <div class="todo">🎯 <strong>Haz esto:</strong> ${tx(it.haz)}</div>
</div></article>`;
  }

  function qCard(q, showBadge) {
    const c = q.libro.color, t = q.libro.tint;
    return `<article class="item q" style="--ic:${c};--it:${t}" id="${q.id}">
      <div class="q-head">${showBadge ? `${q.libro.icono} ${esc(q.libro.nombre)} · ` : ""}${tx(q.titulo)}</div>
      <div class="q-dice">🗣️ El paciente dice: ${tx(q.dice)}</div>
      <div class="q-preg"><div class="lbl">❓ Pregúntale</div><ul>${q.preguntas.map((p) => `<li>${tx(p)}</li>`).join("")}</ul></div>
      <div class="q-wrap"><table class="causes"><thead><tr><th>🔍 Causa</th><th>🛠️ Solución</th><th>⚠️ Riesgo</th></tr></thead><tbody>
      ${q.causas.map((x) => `<tr><td data-l="Causa">${tx(x.causa)}</td><td class="sol" data-l="Solución">${tx(x.solucion)}</td><td class="rie" data-l="Riesgo">${x.riesgo ? tx(x.riesgo) : "—"}</td></tr>`).join("")}
      </tbody></table></div></article>`;
  }

  function searchBlock(kind, color, placeholder, examples) {
    const q = queries[kind] || "";
    return `<div class="search ${q ? "has" : ""}" style="--c:${color}">
        <span class="sic">${ICON.search}</span>
        <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="${esc(placeholder)}" value="${esc(q)}" aria-label="Buscar">
        <button class="clear" type="button" aria-label="Borrar">×</button></div>
      <div class="hint">Ejemplos: ${examples}</div><div class="results" id="results"></div>`;
  }

  function wireSearch(kind, run) {
    const input = $("#q"), box = $(".search");
    const go = () => { queries[kind] = input.value; box.classList.toggle("has", !!input.value); run(input.value); };
    input.addEventListener("input", go);
    $(".clear").onclick = () => { input.value = ""; go(); input.focus(); };
    run(input.value);
  }

  function tabs(list, base, current) {
    return `<nav class="tabs" aria-label="Libros">${list.map((b) =>
      `<a class="tab" style="--tc:${b.color}" href="#/${base}/${b.id}" ${b.id === current ? 'aria-current="page"' : ""}>${b.icono} ${esc(b.nombre)}</a>`).join("")}</nav>`;
  }

  function crumbs(parts) {
    $("#crumbs").innerHTML = parts.map((p, i) =>
      (i ? '<span class="sep">›</span>' : "") + (p[1] ? `<a href="${p[1]}">${esc(p[0])}</a>` : `<span>${esc(p[0])}</span>`)).join("");
  }

  /* ───────── pantallas ───────── */
  function home() {
    crumbs([]);
    const card = (o) => `<section class="home-card" style="--c:${o.c};--t:${o.t}">
      <a class="home-head" href="${o.href}"><span class="home-icon">${o.icon}</span><span><h2>${o.title}</h2><p>${o.sub}</p></span></a>
      <ul class="home-list">${o.items.map((i) => `<li><a href="${i.href}"><span class="dot" style="background:${i.color}"></span>${i.icono} ${esc(i.nombre)}<span class="chev">${ICON.chev}</span></a></li>`).join("")}</ul>
      <a class="home-cta" href="${o.href}">Entrar ›</a></section>`;
    return `<div class="hero"><h1>¿Qué necesitas ahora?</h1><p>Elige un repositorio.</p></div>
      <div class="home-grid">
      ${card({ c: "#C8102E", t: "#FDECEE", icon: "💬", title: "Repositorio de objeciones", sub: "Cómo abordar una objeción",
        href: `#/objeciones/${OBJ[0].id}`, items: OBJ.map((b) => ({ ...b, href: `#/objeciones/${b.id}` })) })}
      ${card({ c: "#343A40", t: "#F1F3F5", icon: "🛠️", title: "Repositorio de quejas técnicas", sub: "Qué revisar y cómo ajustar cuando algo no suena bien",
        href: `#/quejas/${QJ[0].id}`, items: QJ.map((b) => ({ ...b, href: `#/quejas/${b.id}` })).concat([{ nombre: "Guía rápida", icono: "📘", color: "#495057", href: "#/guia" }]) })}
      ${card({ c: "#0B7285", t: "#E3F4F7", icon: "🎙️", title: "Habla de Audio", sub: "Cómo hablamos de audio cada figura del equipo",
        href: `#/habla/${HABLA[0].id}`, items: HABLA.map((b) => ({ ...b, href: `#/habla/${b.id}` })) })}
      </div>`;
  }

  function objBook(id) {
    const b = OBJ.find((x) => x.id === id) || OBJ[0];
    crumbs([["Inicio", "#/"], ["Objeciones", `#/objeciones/${OBJ[0].id}`], [b.nombre]]);
    const html = `<div class="book-head" style="--c:${b.color}"><span class="ic">${b.icono}</span><div><h1>Objeciones · ${esc(b.nombre)}</h1>
        <p>Argumenta con «${esc(b.argumenta)}»</p></div></div>
      ${remember(REC_OBJ, b.color)}
      ${tabs(OBJ, "objeciones", b.id)}
      ${searchBlock("obj", b.color, "¿Qué te ha dicho el paciente?", "«es caro» · «se lo diré a mis hijos» · «me da vergüenza» · «no se conecta al móvil»")}
      <div class="section-title"><h2>📋 Listado · ${b.items.length} objeciones</h2>
        <label class="toggle"><input type="checkbox" id="mine" ${onlyMine ? "checked" : ""}> Solo mis ⭐</label></div>
      <div class="list obj" id="list"></div>`;
    return { html, after() {
      const list = () => {
        const items = b.items.map((it) => ({ ...it, libro: b })).filter((it) => !onlyMine || isFav(it.id));
        $("#list").innerHTML = items.length ? items.map((it) => objCard(it, false)).join("")
          : `<div class="empty">Aún no tienes ⭐ en este libro. Pulsa «¿Te funciona?» en las respuestas que te sirvan.</div>`;
      };
      const search = (q) => {
        const r = rank(ALL_OBJ, q, (x) => x.dice + " " + x.claves, (x) => x.responde + " " + x.haz + " " + x.libro.nombre);
        $("#results").innerHTML = !q.trim() ? "" : r.length
          ? `<h3>✅ Lo más parecido (de todos los libros)</h3><div class="list obj">${r.map((it) => objCard(it, true)).join("")}</div>`
          : `<div class="none">😕 No encuentro nada parecido. Prueba con otras palabras o mira el listado.</div>`;
      };
      $("#mine").onchange = (e) => { onlyMine = e.target.checked; list(); };
      list(); wireSearch("obj", search);
      document.getElementById("app").onclick = (e) => {
        const btn = e.target.closest("[data-fav]"); if (!btn) return;
        toggleFav(btn.dataset.fav); list(); search($("#q").value);
      };
    } };
  }

  function qBook(id) {
    const b = QJ.find((x) => x.id === id) || QJ[0];
    crumbs([["Inicio", "#/"], ["Quejas técnicas", `#/quejas/${QJ[0].id}`], [b.nombre]]);
    const html = `<div class="book-head" style="--c:${b.color}"><span class="ic">${b.icono}</span><div><h1>Quejas · ${esc(b.nombre)}</h1>
        <p>${esc(b.desc)}</p></div></div>
      ${remember(REC_QJ, b.color)}
      ${tabs(QJ.concat([{ id: "guia", nombre: "Guía rápida", icono: "📘", color: "#495057" }]).map((x) => x), "quejas", b.id).replace('href="#/quejas/guia"', 'href="#/guia"')}
      ${searchBlock("qj", b.color, "¿De qué se queja el paciente?", "«me retumba la voz» · «suena metálico» · «pita al masticar» · «gasta mucha pila»")}
      <p class="legend">${tx(LEYENDA)}</p>
      <div class="section-title"><h2>📋 Listado · ${b.quejas.length} quejas</h2></div>
      <div class="list">${b.quejas.map((q) => qCard({ ...q, libro: b }, false)).join("")}</div>`;
    return { html, after() {
      wireSearch("qj", (q) => {
        const r = rank(ALL_QJ, q, (x) => x.titulo + " " + x.dice,
          (x) => x.preguntas.join(" ") + " " + x.causas.map((c) => c.causa + " " + c.solucion).join(" ") + " " + x.libro.nombre);
        $("#results").innerHTML = !q.trim() ? "" : r.length
          ? `<h3>✅ Lo más parecido (de todos los libros)</h3><div class="list">${r.map((x) => qCard(x, true)).join("")}</div>`
          : `<div class="none">😕 No encuentro nada parecido. Prueba con otras palabras o mira el listado.</div>`;
      });
    } };
  }

  function guia() {
    crumbs([["Inicio", "#/"], ["Quejas técnicas", `#/quejas/${QJ[0].id}`], ["Guía rápida"]]);
    return `<div class="book-head" style="--c:#495057"><span class="ic">📘</span><div><h1>Guía rápida antes de reprogramar</h1>
      <p>Preguntas maestras, intensidades, frecuencias y glosario.</p></div></div>
      ${tabs(QJ.concat([{ id: "guia", nombre: "Guía rápida", icono: "📘", color: "#495057" }]), "quejas", "guia").replace('href="#/quejas/guia"', 'href="#/guia"')}
      <div style="margin-top:14px">${GUIA.map(([t, l]) => `<section class="panel"><h2>${t}</h2><ul>${l.map((x) => `<li>${tx(x)}</li>`).join("")}</ul></section>`).join("")}</div>`;
  }

  function speechList(b) {
    const groups = [];
    b.speech.forEach((s) => { let g = groups.find((x) => x.lugar === s.lugar); if (!g) groups.push(g = { lugar: s.lugar, items: [] }); g.items.push(s); });
    let n = 0;
    return groups.map((g) => `<h3 class="place" style="--c:${b.color}">${esc(g.lugar)}</h3><div class="list">${g.items.map((s) =>
      `<article class="item speech" style="--ic:${b.color}"><div class="item-body">
        <span class="badge">${++n} · ${esc(s.momento)}</span>
        <p class="line">🗣️ «${tx(s.dices)}»</p>
        ${s.haz ? `<div class="todo">🎯 <strong>Haz esto:</strong> ${tx(s.haz)}</div>` : ""}</div></article>`).join("")}</div>`).join("");
  }

  function habla(id) {
    const b = HABLA.find((x) => x.id === id) || HABLA[0];
    crumbs([["Inicio", "#/"], ["Habla de Audio", `#/habla/${HABLA[0].id}`], [b.nombre]]);
    return `<div class="book-head" style="--c:${b.color}"><span class="ic">${b.icono}</span><div><h1>Habla de Audio · ${esc(b.nombre)}</h1>
      <p>${esc(b.desc)}</p></div></div>
      ${remember(REC_HABLA, b.color)}
      ${tabs(HABLA, "habla", b.id)}
      <div class="section-title"><h2>📋 Speech</h2></div>
      ${b.speech.length ? speechList(b) : `<div class="empty">⏳ Aquí irá el speech en cuanto esté listo.</div>`}`;
  }

  /* ───────── router ───────── */
  function route() {
    const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
    const app = $("#app");
    app.onclick = null;
    let view;
    if (parts[0] === "objeciones") view = objBook(parts[1]);
    else if (parts[0] === "quejas") view = qBook(parts[1]);
    else if (parts[0] === "guia") view = guia();
    else if (parts[0] === "habla") view = habla(parts[1]);
    else view = home();
    if (typeof view === "string") view = { html: view };
    app.innerHTML = view.html;
    if (view.after) view.after();
    window.scrollTo(0, 0);
  }


  /* Pequeño modal con el significado del término */
  const tip = document.createElement("div");
  tip.className = "tip"; tip.setAttribute("role", "tooltip"); tip.hidden = true;
  document.body.appendChild(tip);
  let tipFor = null, shownAt = 0;
  function showTip(el) {
    const t = TERMS[el.dataset.term]; if (!t) return;
    if (tipFor !== el) shownAt = Date.now();
    tipFor = el;
    tip.innerHTML = `<b>${esc(el.dataset.term)} · ${esc(t[0])}</b><span>${esc(t[1])}</span>`;
    tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    let top = r.top - h - 8; let below = false;
    if (top < 8) { top = r.bottom + 8; below = true; }
    tip.style.left = left + "px"; tip.style.top = top + "px";
    tip.classList.toggle("below", below);
  }
  function hideTip() { tip.hidden = true; tipFor = null; }
  let lastTouch = 0;
  document.addEventListener("touchstart", () => { lastTouch = Date.now(); }, { passive: true, capture: true });
  const isTouch = () => Date.now() - lastTouch < 800;
  document.addEventListener("mouseover", (e) => { if (isTouch()) return; const el = e.target.closest(".term"); if (el) showTip(el); });
  document.addEventListener("mouseout", (e) => { if (isTouch()) return; if (e.target.closest(".term")) hideTip(); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest(".term"); if (el) showTip(el); });
  document.addEventListener("focusout", (e) => { if (!isTouch() && e.target.closest(".term")) hideTip(); });
  document.addEventListener("click", (e) => { const el = e.target.closest(".term"); if (el) { e.stopPropagation(); if (tipFor === el && Date.now() - shownAt > 400) hideTip(); else showTip(el); } else if (tipFor) hideTip(); }, true);
  window.addEventListener("scroll", hideTip, { passive: true });

  window.addEventListener("hashchange", () => { hideTip(); route(); });
  route();
})();

</script>
</body>
</html>
